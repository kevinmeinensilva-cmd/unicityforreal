<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Entrar | UniCity</title>
    <link rel="icon" href="logo.jpg">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="auth">
        <div class="lado"><img src="premium.jpg" alt="">
            <div>
                <h2>Seu próximo descanso começa aqui.</h2>
                <p>Reserve quartos e acompanhe suas estadias no UniCity.</p>
            </div>
        </div>
        <main>
            <form class="form" data-modo="login"><a class="marca" href="index.html" style="color:var(--bordo)"><img
                        src="logo.jpg" alt="">UniCity</a>
                <h1>Entrar</h1>
                <p>Acesse sua conta para reservar.</p><label class="campo">E-mail<input type="email" name="email"
                        autocomplete="email" placeholder="voce@exemplo.com" required></label><label
                    class="campo">Senha<input type="password" name="senha" autocomplete="current-password"
                        placeholder="Digite sua senha" required></label><button class="btn"
                    type="submit">Entrar</button>
                <p class="msg" role="status"></p>
                <p class="troca">Ainda não tem conta? <a href="cadastro.html">Cadastre-se</a></p>
            </form>
        </main>
    </div>
    <script src="app.js"></script>
</body>

</html>
